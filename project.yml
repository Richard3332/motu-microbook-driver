name: MicroBook
options:
  bundleIdPrefix: ${BUNDLE_PREFIX}
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
targets:
  MicroBook:
    type: application
    platform: macOS
    sources:
      - app/main.swift
    info:
      path: app/Info.plist
    entitlements:
      path: app/app.entitlements
      properties:
        com.apple.developer.system-extension.install: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_PREFIX}.MicroBook
        PRODUCT_NAME: MicroBookInstaller
        INFOPLIST_FILE: app/Info.plist
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: MicroBookDriverAudio     # was MicroBookDriver (USB-only fallback); same bundle id, embed ONE at a time
        embed: true
        codeSign: true
        copy:
          destination: productsDirectory
          subpath: MicroBookInstaller.app/Contents/Library/SystemExtensions
  MicroBookDriver:
    type: driver-extension
    platform: macOS
    sources:
      - path: dext
        includes: ["MicroBookDevice.*", "MicroBookInterface.*"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_PREFIX}.MicroBook.driver
        PRODUCT_NAME: ${BUNDLE_PREFIX}.MicroBook.driver
        INFOPLIST_FILE: dext/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: dext/MicroBookDriver.entitlements
        SDKROOT: driverkit
        MACOSX_DEPLOYMENT_TARGET: ""
        SUPPORTED_PLATFORMS: driverkit
        DRIVERKIT_DEPLOYMENT_TARGET: "25.0"
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: YES
        OTHER_LDFLAGS: "-framework DriverKit -framework USBDriverKit"
  MicroBookDriverAudio:
    # Core Audio flavour (AudioDriverKit). Needs com.apple.developer.driverkit.family.audio.
    type: driver-extension
    platform: macOS
    sources:
      - path: dext
        includes: ["MicroBookDevice.*", "MicroBookAudioDriver.*", "MicroBookAudioDevice.*", "MicroBookRate.h"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_PREFIX}.MicroBook.driver
        PRODUCT_NAME: ${BUNDLE_PREFIX}.MicroBook.driver
        INFOPLIST_FILE: dext/Info-Audio.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: dext/MicroBookDriverAudio.entitlements
        SDKROOT: driverkit
        SUPPORTED_PLATFORMS: driverkit
        MACOSX_DEPLOYMENT_TARGET: ""
        DRIVERKIT_DEPLOYMENT_TARGET: "25.0"
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: YES
        CLANG_CXX_LANGUAGE_STANDARD: "gnu++20"
        OTHER_LDFLAGS: "-framework DriverKit -framework USBDriverKit -framework AudioDriverKit"
